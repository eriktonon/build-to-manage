name: IBM Build to Manage — Contract & Syntax Verification

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  verify-btm-practices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r DistributedTrace/python/service1/requirements.txt
          pip install -r HealthCheckAPIs/python/frameworks/requirements.txt

      - name: Run Build to Manage Contract & Syntax Verification Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
